
name: Build Minimal Skin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build skins
        run: |
          python gen_format2_filename_parser.py --out dist

      - name: Upload skins
        uses: actions/upload-artifact@v4
        with:
          name: Minimal-Skins
          path: dist/*.fbskin
